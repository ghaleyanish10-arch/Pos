services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mesa_os
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mesa_os"]
      interval: 2s
      timeout: 5s
      retries: 25
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  api:
    build:
      context: ./backend
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@db:5432/mesa_os?sslmode=disable
      JWT_SECRET: local-dev-secret-change-me
      JWT_ACCESS_TTL: 24h
      SHIFT_TTL: 12h
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  pgdata: